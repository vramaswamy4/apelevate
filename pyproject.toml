[project]
name = "apelevate"
version = "2.0.0"
description = "A marketplace for AP-exam tutoring: students buy tokens and enrol in mentor-led classes."
requires-python = ">=3.12"
readme = "README.md"

# Dependencies are pinned in requirements.txt / requirements-dev.txt, which is what hosts and CI
# install. This file holds tool configuration.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "DJ",       # flake8-django
  "S",        # bandit (security)
  "SIM",      # simplify
  "RUF",
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"*/management/commands/seed_demo.py" = ["S105", "S106"]
"scripts/**" = ["S105", "S603"]  # dev tooling: demo password, runs manage.py

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "tests/*", "config/asgi.py", "config/wsgi.py", "manage.py", "scripts/*"]
