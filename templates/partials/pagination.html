{% if page.has_other_pages %}<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn--ghost" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page.previous_page_number }}" rel="prev">Previous</a>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn--ghost" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page.next_page_number }}" rel="next">Next</a>{% endif %}
</nav>{% endif %}
